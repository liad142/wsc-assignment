<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentOps Conference Talent Pool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>:root{
  /* Doodle: paper canvas with a dot grid, navy ink outlines, hard offset shadows, slightly uneven corners.
     Hand-lettered face for headings and buttons; a plain sans for dense evidence so it stays readable. */
  --canvas:#f8f5ee; --dot:#ded8c9; --surface:#fffdf8; --ink:#263d5b; --text:#111827; --muted:#56657b; --line:#263d5b; --soft:#efeadf;
  --brand:#49b6e5; --brand-ink:#0f2a44; --mark:#ebcdc3; --mark-ink:#263d5b;
  --ok:#1d5c3a; --ok-bg:#e1efe4; --part:#7a4b0c; --part-bg:#f6ead0; --gap:#56657b; --gap-bg:#efeadf;
  --c0:#263d5b; --c1:#6f819b; --c2:#a9b5c6; --c3:#d5dbe4; --c4:#ebcdc3;
  --display:"DM Sans",system-ui,"Segoe UI",Arial,sans-serif; --body:"DM Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --r1:14px 18px 13px 17px / 17px 13px 18px 14px; --r2:10px 13px 9px 12px / 12px 9px 13px 10px; --r3:22px 26px 20px 25px / 25px 20px 26px 22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --canvas:#1b2433; --dot:#2c3950; --surface:#232f43; --ink:#ece6d6; --text:#f1ede3; --muted:#a9b4c4; --line:#ece6d6; --soft:#2c3950;
    --brand:#6cc6ee; --brand-ink:#0f2a44; --mark:#e9c3b6; --mark-ink:#1b2433;
    --ok:#a9dcbc; --ok-bg:#243f33; --part:#ecd09a; --part-bg:#453a22; --gap:#a9b4c4; --gap-bg:#2c3950;
    --c0:#ece6d6; --c1:#b3bccb; --c2:#7f8ca1; --c3:#4c5a72; --c4:#e9c3b6; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --canvas:#1b2433; --dot:#2c3950; --surface:#232f43; --ink:#ece6d6; --text:#f1ede3; --muted:#a9b4c4; --line:#ece6d6; --soft:#2c3950;
  --brand:#6cc6ee; --brand-ink:#0f2a44; --mark:#e9c3b6; --mark-ink:#1b2433;
  --ok:#a9dcbc; --ok-bg:#243f33; --part:#ecd09a; --part-bg:#453a22; --gap:#a9b4c4; --gap-bg:#2c3950;
  --c0:#ece6d6; --c1:#b3bccb; --c2:#7f8ca1; --c3:#4c5a72; --c4:#e9c3b6; }
*{box-sizing:border-box}
html,body{height:100%}
html{font-family:var(--body);font-size:15px;line-height:1.5}
body{margin:0;background:var(--canvas);color:var(--ink)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* rail */
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;padding:0 8px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:0;color:var(--muted);margin-top:4px}
.rail h2{font-size:13px;font-weight:500;color:var(--muted);padding:0 8px;margin-bottom:6px}
.rolebtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:start;background:none;border:0;border-radius:12px;padding:9px 10px;cursor:pointer}
.rolebtn b{font-weight:600;font-size:14.5px;line-height:1.25}
.rolebtn span{grid-column:1;font-size:12.5px;color:var(--muted)}
.rolebtn i{grid-row:1 / span 2;grid-column:2;align-self:center;font-style:normal;font-family:var(--display);font-weight:600;font-size:15px;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;background:var(--soft);font-variant-numeric:tabular-nums}
.rolebtn:hover{background:var(--soft)}
.rolebtn[aria-current="true"]{background:var(--ink);color:var(--surface)}
.rolebtn[aria-current="true"] span{color:inherit;opacity:.72}
.rolebtn[aria-current="true"] i{background:var(--mark);color:var(--mark-ink)}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{text-align:start;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button:hover{background:var(--soft);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.rail .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px}
.jobpick{display:none}

/* page */
main{padding:28px clamp(16px,2.4vw,36px) 64px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:28px;align-items:start;max-width:1320px}
.jobcard h1,.pagehead h1{font-family:var(--display);font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.jobcard .meta{color:var(--muted);margin-top:6px}
.lede{font-size:17px;line-height:1.45;margin-top:14px;max-width:56ch}
.lede b{font-weight:600}
.reqs{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin-top:16px;font-size:13.5px;align-items:baseline}
.reqs dt{color:var(--muted)} .reqs dd{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;border-radius:7px;padding:1px 8px;font-size:12.5px;background:var(--soft);white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 6px}
.controls input[type=search]{flex:1 1 220px;min-width:0}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
details.weights{margin-top:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
details.weights summary{cursor:pointer;padding:10px 14px;font-weight:500}
.wgrid{display:grid;grid-template-columns:130px 1fr 44px;gap:8px 12px;align-items:center;padding:4px 14px 12px;font-size:13.5px}
.wgrid input{accent-color:var(--brand)} .wgrid output{font-variant-numeric:tabular-nums;text-align:end}
.wnote{padding:0 14px 14px;color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wnote span{flex:1 1 260px}

/* tiers and rows */
.band{margin-top:22px}
.band h2{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.band h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.row:hover{border-color:var(--muted)}
.row[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.score{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.band:first-of-type .row .score{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:8px 0;text-align:center}
.row .who b{font-weight:600;font-size:15.5px} .row .who span{color:var(--muted)}
.row .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{grid-column:1 / -1;display:flex;gap:4px;min-width:0}
.seg{flex:1 1 0;min-width:0;border-radius:7px;padding:3px 7px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.full{background:var(--ok-bg);color:var(--ok)}
.seg.partial{background:var(--part-bg);color:var(--part)}
.seg.to_verify{background:transparent;color:var(--gap);box-shadow:inset 0 0 0 1px var(--line)}
.seg::before{font-weight:700;margin-inline-end:4px}
.seg.full::before{content:"\2713"} .seg.partial::before{content:"\2248"} .seg.to_verify::before{content:"?"}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.full,.pill.worked_together,.pill.in_domain{background:var(--ok-bg);color:var(--ok)}
.pill.partial,.pill.same_employer,.pill.adjacent{background:var(--part-bg);color:var(--part)}
.pill.to_verify,.pill.linkedin_only,.pill.none,.pill.outside,.pill.unknown{background:var(--gap-bg);color:var(--gap)}
.below{margin-top:24px}
.below summary{cursor:pointer;color:var(--muted);font-weight:500;padding:6px 0}
.below .row{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:14px;align-items:center}
.legend .seg{flex:0 0 auto}

/* evidence sheet */
.detail{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pad{padding:22px 24px}
.detail .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.detail h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.detail .big{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:.9;text-align:end}
.detail .big small{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:8px;line-height:1.2}
.next{background:var(--ink);color:var(--surface);border-radius:14px;padding:14px 16px;margin-top:16px}
.next b{display:block;font-size:13px;font-weight:500;opacity:.7;margin-bottom:2px}
.sec{border-top:1px solid var(--line);padding:18px 24px}
.sec h3{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.sec h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-inline-start:6px}
table.ev{width:100%;border-collapse:collapse;font-size:14px}
table.ev td{padding:8px 10px 8px 0;vertical-align:top;border-top:1px solid var(--soft)}
table.ev tr:first-child td{border-top:0}
table.ev td:first-child{width:104px} table.ev td:nth-child(2){font-weight:600;width:30%}
table.ev .why{color:var(--muted)} table.ev .why b{color:var(--ink);font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);gap:2px}
.stack i{display:block;height:100%}
.stack .s0{background:var(--brand)} .stack .s1{background:color-mix(in srgb,var(--brand) 62%,var(--surface))} .stack .s2{background:var(--ink)} .stack .s3{background:var(--muted)} .stack .s4{background:var(--mark)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin-top:10px;font-size:13.5px}
.parts span{display:flex;gap:7px;align-items:baseline}
.parts em{font-style:normal;color:var(--muted);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.parts u{display:inline-block;width:10px;height:10px;border-radius:3px;text-decoration:none;flex:none;transform:translateY(1px)}
.conn{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:7px 0}
.conn .av{grid-row:1 / span 2;width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px}
.conn b{font-weight:600} .conn .d{grid-column:2 / -1;color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:128px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
hr.sep{border:0;border-top:1px solid var(--soft);margin:12px 0}

/* pool and how-it-works */
.pagehead{max-width:1320px}
.pagehead p{color:var(--muted);max-width:68ch;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tablewrap{overflow-x:auto;max-width:1320px}
table.pool{width:100%;border-collapse:collapse;font-size:14px;min-width:920px}
table.pool th{text-align:start;font-weight:500;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.pool td{padding:10px 14px;border-bottom:1px solid var(--soft);vertical-align:top}
table.pool tr:last-child td{border-bottom:0}
.importbox{max-width:1320px;margin-top:20px}
.importbox h3{font-family:var(--display);font-size:17px;font-weight:600}
.import{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:end;margin-top:12px}
.import label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.notice{background:var(--part-bg);color:var(--part);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.notice ul{margin:6px 0 0;padding-inline-start:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;max-width:1320px;margin-top:22px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.steps div{padding:20px 22px;border-inline-end:1px solid var(--line)}
.steps div:last-child{border-inline-end:0}
.steps .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--brand)}
.steps h3{font-family:var(--display);font-size:17px;font-weight:600;margin:8px 0 4px}
.block{max-width:1320px;margin-top:20px}
.block h3{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em}
table.terms{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
table.terms th{text-align:start;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
table.terms td{padding:8px 14px;border-top:1px solid var(--soft);vertical-align:top}
table.terms tr.g td{font-family:var(--display);font-weight:600;font-size:15px;padding-top:18px;border-top:0}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 16px;font-size:14px;z-index:5}
textarea.csv{width:100%;height:150px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}

@media (max-width:1120px){.grid{grid-template-columns:minmax(0,1fr)}.detail{position:static}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .rail .roles,.rail .foot{display:none} .jobpick{display:block;flex:1 1 200px} .jobpick select{width:100%}
  nav.tabs{flex-direction:row}
  .steps div{border-inline-end:0;border-bottom:1px solid var(--line)}
}
@media (max-width:520px){.row{grid-template-columns:50px minmax(0,1fr)}.row .right{grid-column:2}.strip{grid-column:1 / -1;flex-wrap:wrap}.seg{flex:1 1 30%}.kv{grid-template-columns:1fr}.wgrid{grid-template-columns:104px 1fr 40px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- theme: ink outlines, offset shadows, paper background ---------- */
body{color:var(--text);background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
h1,h2,h3,.brand,.score,.detail .big,.steps .n,.btn,.rolebtn b,nav.tabs button,details.weights summary{font-family:var(--display);font-weight:400;letter-spacing:0;color:var(--ink)}
.brand{font-size:26px} .jobcard h1,.pagehead h1{font-size:clamp(34px,3.6vw,50px);line-height:1.05}
.band h2{font-size:21px} .sec h3{font-size:19px} .detail h2{font-size:32px} .detail .big{font-size:48px} .score{font-size:23px}
.band h2 small,.sec h3 small{font-family:var(--body)}
.rail{background:var(--surface);border-inline-end:3px solid var(--ink)}
.rail h2{font-family:var(--body);font-weight:500;color:var(--muted)}
.rolebtn{border:2.5px solid transparent;border-radius:var(--r1);margin-bottom:6px}
.rolebtn:hover{background:var(--soft)}
.rolebtn i{font-family:var(--display);font-weight:400;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.rolebtn[aria-current="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.rolebtn[aria-current="true"] b{color:var(--brand-ink)} .rolebtn[aria-current="true"] i{background:var(--surface);color:#263d5b}
nav.tabs button{font-size:16px;border-radius:var(--r2);border:2px solid transparent}
nav.tabs button[aria-selected="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--ink)}
.chip{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r2);color:var(--ink)}
select,input[type=search]{border:2.5px solid var(--ink);border-radius:var(--r2);background:var(--surface);color:var(--text)}
.btn{font-size:16px;border:2.5px solid var(--ink);border-radius:var(--r2);background:var(--surface);box-shadow:4px 4px 0 var(--ink);padding:8px 16px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);border-color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--mark);color:var(--mark-ink);border-color:var(--ink)}
.controls{gap:12px}
details.weights{border:2.5px solid var(--ink);border-radius:var(--r1);margin-top:14px}
.wgrid input{accent-color:var(--ink)}
.row{border:2.5px solid var(--ink);border-radius:var(--r1);box-shadow:4px 4px 0 var(--ink);margin-bottom:14px;transition:transform .08s,box-shadow .08s}
.row:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);border-color:var(--ink)}
.row[aria-current="true"]{background:var(--mark);border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.row[aria-current="true"] .who span{color:var(--mark-ink)}
.row .who b{color:var(--ink)}
.band:first-of-type .row .score{background:var(--brand);color:var(--brand-ink);border:2px solid var(--ink);border-radius:var(--r2);transform:rotate(-3deg);padding:7px 0}
.seg{border-radius:8px 10px 7px 9px;border:1.5px solid var(--ink)}
.seg.full{background:var(--ok-bg);color:var(--ok)} .seg.partial{background:var(--part-bg);color:var(--part)}
.seg.to_verify{background:var(--surface);color:var(--gap);border-style:dashed;box-shadow:none}
.pill{border:1.5px solid var(--ink)}
.below .row{box-shadow:none;border-style:dashed}
.detail{border:3px solid var(--ink);border-radius:var(--r3);box-shadow:7px 7px 0 var(--ink)}
.next{background:var(--mark);color:var(--mark-ink);border:2.5px solid var(--ink);border-radius:var(--r1)}
.next b{font-family:var(--display);font-weight:400;font-size:16px;opacity:1}
.sec{border-top:2px dashed var(--ink)}
table.ev td{border-top:1.5px dotted var(--muted)}
.stack{height:18px;border:2px solid var(--ink);border-radius:9px 11px 8px 10px;background:var(--surface);gap:0}
.stack i+i{border-inline-start:2px solid var(--ink)}
.stack .s0{background:var(--c0)} .stack .s1{background:var(--c1)} .stack .s2{background:var(--c2)} .stack .s3{background:var(--c3)} .stack .s4{background:var(--c4)}
.parts u{border:1.5px solid var(--ink)}
.conn .av{border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-weight:400;color:var(--ink)}
.card,.steps{border:2.5px solid var(--ink);border-radius:var(--r1);box-shadow:5px 5px 0 var(--ink)}
.steps div{border-inline-end:2px dashed var(--ink)} .steps .n{color:var(--brand);-webkit-text-stroke:1px var(--ink)}
table.pool th,table.terms th{border-bottom:2px solid var(--ink)}
.notice{border:2px solid var(--ink);border-radius:var(--r1)}
.toast{border:2px solid var(--surface);border-radius:var(--r2);background:var(--ink);color:var(--surface);font-family:var(--display)}
textarea.csv{border:2.5px solid var(--ink);border-radius:var(--r2)}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.legend .seg{font-size:12.5px}
@media (max-width:820px){.rail{border-inline-end:0;border-bottom:3px solid var(--ink)}.steps div{border-inline-end:0;border-bottom:2px dashed var(--ink)}}
.detail .big small{white-space:nowrap}
.rolebtn b{font-size:16px} .brand small{font-family:var(--body)}

/* ---------- typography and accent: one plain typeface, one accent colour ---------- */

        parseCsv(texts.jobs),
        parseCsv(texts.employees),
        jobId,
        taxonomy,
        config,
        weights,
      ),
    );
  }
  return { buildTalentPool, matchJob, runFromCsvText };
});
</script>
<script>// Recruiter view. Display only: every number shown here comes from the same engine the command line uses.
(function () {
  "use strict";
  const T = window.TalentOps,
    D = window.TALENTOPS_DATA,
    $ = (s) => document.querySelector(s);
  const esc = (v) =>
    String(v == null ? "" : v).replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const jobs = T.parseCsv(D.jobs),
    employees = T.parseCsv(D.employees);
  const LEVEL = { full: "Documented", partial: "Related", to_verify: "To verify" };
  const REL = {
    in_domain: "In domain",
    adjacent: "Adjacent",
    outside: "Outside",
    unknown: "Unknown",
  };
  const WEIGHT_LABEL = {
    required: "Required skills",
    domains: "Key domains",
    role_family: "Role family",
    seniority: "Seniority",
    nice_to_have: "Nice to have",
  };
  const state = {
    view: "matches",
    jobId: "JOB001",
    weights: Object.assign({}, D.config.weights),
    selected: null,
    search: "",
    conn: "any",
    attendees: T.parseCsv(D.attendees),
    profiles: T.parseCsv(D.profiles),
    imported: null,
    pf: { conference: "all", domain: "all", relevance: "all", q: "" },
    csv: "",
  };
  let pool, result;

  const counts = {};
  function compute() {
    pool = T.buildTalentPool(state.attendees, state.profiles, D.config);
    jobs.forEach((j) => {
      counts[j.job_id] = T.matchJob(
        pool,
        jobs,
        employees,
        j.job_id,
        D.taxonomy,
        D.config,
      ).shortlist.length;
    });
    result = T.matchJob(pool, jobs, employees, state.jobId, D.taxonomy, D.config, state.weights);
    if (!result.matches.some((m) => m.contact.contact_id === state.selected))
      state.selected =
        (result.shortlist[0] || result.matches[0] || { contact: {} }).contact.contact_id || null;
  }
  const titleOf = (c) => (c.profile ? c.profile.current_title : c.title),
    companyOf = (c) => (c.profile ? c.profile.current_company : c.company);
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => (t.hidden = true), 3200);
  }

  // ---------- Role matches ----------
  function visible(m) {
    const q = state.search.trim().toLowerCase(),
      c = m.contact;
    if (
      q &&
      !(
        c.full_name +
        " " +
        titleOf(c) +
        " " +
        companyOf(c) +
        " " +
        (c.profile ? c.profile.skills.join(" ") : "")
      )
        .toLowerCase()
        .includes(q)
    )
      return false;
    if (
      state.conn === "worked" &&
      !m.connections.list.some((x) => x.strength === "worked_together")
    )
      return false;
    if (state.conn === "any_conn" && !m.connections.list.length) return false;
    return true;
  }
  function rowHtml(m) {
    const c = m.contact,
      top = m.connections.list[0];
    const strip = m.required
      .map(
        (r) =>
          '<span class="seg ' +
          r.level +
          '" title="' +
          esc(
            r.requirement +
              ": " +
              LEVEL[r.level] +
              (r.matched_term ? " (" + r.matched_term + ")" : ""),
          ) +
          '">' +
          esc(r.requirement) +
          "</span>",
      )
      .join("");
    const conn = top
      ? '<span class="pill ' +
        top.strength +
        '">' +
        esc(
          top.strength === "worked_together"
            ? "Worked with " + top.name.split(" ")[0]
            : top.strength === "same_employer"
              ? "Shared employer"
              : m.connections.list.length + " on LinkedIn",
        ) +
        "</span>"
      : '<span class="pill none">' +
        (m.connections.status === "unknown" ? "Connections unknown" : "No connection") +
        "</span>";
    return (
      '<button class="row" data-id="' +
      esc(c.contact_id) +
      '" aria-current="' +
      (c.contact_id === state.selected) +
      '">' +
      '<span class="score">' +
      m.score.toFixed(1) +
      "</span>" +
      '<span class="who"><b>' +
      esc(c.full_name) +
      "</b> <span>" +
      esc(titleOf(c)) +
      ", " +
      esc(companyOf(c)) +
      (m.preliminary ? " (preliminary)" : "") +
      "</span></span>" +
      '<span class="right">' +
      conn +
      "</span>" +
      '<span class="strip" aria-label="' +
      m.required_full +
      " of " +
      m.required.length +
      ' required skills documented">' +
      strip +
      "</span></button>"
    );
  }
  function matchesHtml() {
    const job = result.job,
      short = result.shortlist.filter(visible),
      below = result.matches.filter((m) => !m.shortlisted).filter(visible);
    const bands = new Map();
    short.forEach((m) => {
      if (!bands.has(m.band)) bands.set(m.band, []);
      bands.get(m.band).push(m);
    });
    const total = Object.values(state.weights).reduce((a, b) => a + b, 0) || 1;
    const changed = Object.keys(state.weights).some(
      (k) => state.weights[k] !== D.config.weights[k],
    );
    const topCount = result.shortlist.filter((m) => m.band === 1).length,
      worked = result.shortlist.filter((m) =>
        m.connections.list.some((x) => x.strength === "worked_together"),
      ).length;
    const chips = (xs) => xs.map((x) => '<span class="chip">' + esc(x) + "</span>").join("");
    const bandHtml = [...bands.entries()]
      .map(([bandNo, ms]) => {
        const lo = Math.min(...ms.map((m) => m.score)),
          hi = Math.max(...ms.map((m) => m.score));
        return (
          '<section class="band"><h2>Priority band ' +
          bandNo +
          " <small>" +
          (ms.length > 1
            ? ms.length +
              " people within " +
              D.config.band_width +
              " points of each other, so treat them as a tie"
            : "score " + hi.toFixed(1)) +
          "</small></h2>" +
          ms.map(rowHtml).join("") +
          "</section>"
        );
      })
      .join("");
    return (
      '<div class="grid"><div>' +
      '<div class="jobcard"><h1>' +
      esc(job.title) +
      '</h1><div class="meta">' +
      esc(job.department) +
      ", " +
      esc(job.seniority.toLowerCase()) +
      " level, " +
      esc(job.job_id) +
      "</div>" +
      '<p class="lede"><b>' +
      result.shortlist.length +
      " of " +
      pool.contacts.length +
      "</b> people we met fit this role. " +
      (topCount > 1
        ? "<b>" + topCount + "</b> are effectively tied at the top"
        : "One stands clear at the top") +
      (worked
        ? ", and <b>" +
          worked +
          "</b> " +
          (worked === 1 ? "has" : "have") +
          " worked alongside someone at WSC."
        : ".") +
      "</p>" +
      '<dl class="reqs"><dt>Required</dt><dd>' +
      chips(job.required) +
      "</dd><dt>Key domains</dt><dd>" +
      chips(job.domains) +
      "</dd><dt>Nice to have</dt><dd>" +
      chips(job.nice_to_have) +
      "</dd></dl></div>" +
      '<div class="controls"><input type="search" id="q" placeholder="Search name, title, company or skill" value="' +
      esc(state.search) +
      '" aria-label="Search matches">' +
      '<select id="conn" aria-label="Filter by connection"><option value="any">Everyone</option><option value="any_conn">Connected to someone at WSC</option><option value="worked">Worked with someone at WSC</option></select>' +
      '<button class="btn primary" id="export">Export shortlist CSV</button><button class="btn" id="copy">Copy CSV</button></div>' +
      '<details class="weights"' +
      (changed ? " open" : "") +
      "><summary>Adjust the scoring weights" +
      (changed ? " (changed)" : "") +
      '</summary><div class="wgrid">' +
      Object.keys(state.weights)
        .map(
          (k) =>
            '<label for="w-' +
            k +
            '">' +
            WEIGHT_LABEL[k] +
            '</label><input type="range" id="w-' +
            k +
            '" data-w="' +
            k +
            '" min="0" max="100" step="5" value="' +
            state.weights[k] +
            '"><output>' +
            Math.round((100 * state.weights[k]) / total) +
            "%</output>",
        )
        .join("") +
      '</div><div class="wnote"><span>Weights change the order. Who is shortlisted depends on evidence, not weights: at least half of the required skills covered, plus evidence for one key domain.</span><button class="btn" id="reset">Reset to 60 / 25 / 5 / 5 / 5</button></div></details>' +
      (state.csv
        ? '<textarea class="csv" id="csvbox" readonly aria-label="Shortlist CSV">' +
          esc(state.csv) +
          "</textarea>"
        : "") +
      (short.length
        ? '<div class="legend"><span class="seg full">documented</span><span class="seg partial">related experience</span><span class="seg to_verify">ask in the first call</span></div>' +
          bandHtml
        : '<div class="card pad" style="margin-top:18px"><b>No one matches these filters.</b><p class="muted">The shortlist for this role has ' +
          result.shortlist.length +
          " contacts. Everyone else stays in the pool for future roles.</p></div>") +
      '<details class="below"><summary>Below the line: ' +
      below.length +
      " contacts who do not meet the shortlist rule</summary>" +
      below.slice(0, 80).map(rowHtml).join("") +
      "</details>" +
      "</div><aside>" +
      detailHtml() +
      "</aside></div>"
    );
  }
  function evRows(list) {
    return list
      .map(
        (r) =>
          '<tr><td><span class="pill ' +
          r.level +
          '">' +
          LEVEL[r.level] +
          "</span></td><td>" +
          esc(r.requirement) +
          '</td><td class="why">' +
          (r.level === "to_verify"
            ? esc(r.question)
            : "<b>" +
              esc(r.matched_term) +
              "</b> in " +
              esc(r.source) +
              (r.source === "skills list"
                ? r.backed_by.length
                  ? "; also backed by " + esc(r.backed_by.join(" and "))
                  : "; self-reported only"
                : "") +
              (r.level === "partial" ? ". " + esc(r.question) : "")) +
          "</td></tr>",
      )
      .join("");
  }
  function detailHtml() {
    const m = result.matches.find((x) => x.contact.contact_id === state.selected);
    if (!m)
      return '<div class="detail"><div class="pad muted">Pick someone from the list to see the evidence.</div></div>';
    const c = m.contact,
      p = c.profile,
      w = state.weights;
    const keys = Object.keys(w),
      wsum = keys.reduce((a, k) => a + w[k], 0) || 1,
      SW = ["var(--c0)", "var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
    const bars =
      '<div class="stack" role="img" aria-label="Score breakdown">' +
      keys
        .map(
          (k, i) => '<i class="s' + i + '" style="width:' + (100 * m.parts[k]) / wsum + '%"></i>',
        )
        .join("") +
      '</div><div class="parts">' +
      keys
        .map(
          (k, i) =>
            '<span><u style="background:' +
            SW[i] +
            '"></u>' +
            WEIGHT_LABEL[k] +
            "<em>" +
            m.parts[k].toFixed(1) +
            " of " +
            w[k] +
            "</em></span>",
        )
        .join("") +
      "</div>";
    const conns = m.connections.list.length
      ? m.connections.list
          .map(
            (x) =>
              '<div class="conn"><span class="av" aria-hidden="true">' +
              esc(
                x.name
                  .split(" ")
                  .map((n) => n[0])
                  .join("")
                  .slice(0, 2),
              ) +
              "</span><b>" +
              esc(x.name) +
              ", " +
              esc(x.title) +
              '</b><span class="pill ' +
              x.strength +
              '">' +
              esc(T.STRENGTH_TEXT[x.strength]) +
              '</span><span class="d">' +
              esc(x.detail) +
              "</span></div>",
          )
          .join("")
      : '<p class="muted">' + esc(m.connections.note) + ". This does not affect the score.</p>";
    const met = c.encounters
      .map(
        (e) =>
          '<dl class="kv"><dt>Conference</dt><dd>' +
          esc(e.conference_name) +
          ", " +
          esc(e.conference_date) +
          "</dd><dt>Captured by</dt><dd>" +
          esc(e.source || "not recorded") +
          '</dd><dt>Domain relevance</dt><dd><span class="pill ' +
          e.relevance.level +
          '">' +
          REL[e.relevance.level] +
          "</span> " +
          esc(e.relevance.reason) +
          "</dd>" +
          (e.notes ? "<dt>Recruiter note</dt><dd>" + esc(e.notes) + "</dd>" : "") +
          "</dl>",
      )
      .join('<hr class="sep">');
    return (
      '<div class="detail"><div class="pad"><div class="head"><div><h2>' +
      esc(c.full_name) +
      '</h2><div class="muted">' +
      esc(titleOf(c)) +
      " at " +
      esc(companyOf(c)) +
      (p && p.location ? ", " + esc(p.location) : "") +
      "</div></div>" +
      '<div class="big">' +
      m.score.toFixed(1) +
      "<small>" +
      (m.shortlisted ? "priority band " + m.band : "below the line") +
      "</small></div></div>" +
      '<p style="margin-top:10px">' +
      esc(T.whyThisPerson(m)) +
      (m.preliminary ? ' <span class="pill partial">preliminary: no LinkedIn profile</span>' : "") +
      "</p>" +
      '<div class="next"><b>Suggested next step</b>' +
      esc(T.nextStep(m)) +
      "</div></div>" +
      '<div class="sec"><h3>Required skills<small>' +
      m.required_full +
      " of " +
      m.required.length +
      ' documented</small></h3><table class="ev">' +
      evRows(m.required) +
      "</table></div>" +
      '<div class="sec"><h3>Key domains</h3><table class="ev">' +
      evRows(m.domains) +
      "</table></div>" +
      '<div class="sec"><h3>Nice to have</h3><table class="ev">' +
      evRows(m.nice_to_have) +
      "</table></div>" +
      '<div class="sec"><h3>Role and seniority</h3><dl class="kv"><dt>Role family</dt><dd>' +
      esc(m.role_family.note) +
      "</dd><dt>Seniority</dt><dd>" +
      esc(m.seniority.note) +
      "</dd></dl></div>" +
      '<div class="sec"><h3>How the score adds up</h3>' +
      bars +
      '<p class="muted small" style="margin-top:10px">The score is documented coverage of this job\'s requirements. It is not a prediction of success.</p></div>' +
      '<div class="sec"><h3>People at WSC<small>never part of the score</small></h3>' +
      conns +
      "</div>" +
      '<div class="sec"><h3>Where we met</h3>' +
      met +
      "</div>" +
      '<div class="sec"><h3>Profile</h3><dl class="kv"><dt>Enrichment</dt><dd>' +
      esc(c.enrichment_status.replace(/_/g, " ")) +
      (c.enrichment_note ? ". " + esc(c.enrichment_note) : "") +
      "</dd><dt>Works in</dt><dd>" +
      esc(c.professional_domains.map((d) => d.domain).join(", ") || "Unknown") +
      "</dd>" +
      (p
        ? "<dt>Skills</dt><dd>" +
          p.skills.map((s) => '<span class="chip">' + esc(s) + "</span>").join(" ") +
          "</dd><dt>Experience</dt><dd>" +
          esc(p.years_experience) +
          " years, " +
          esc(p.industry) +
          "</dd><dt>Before</dt><dd>" +
          esc(p.past_titles.join("; ")) +
          "</dd>"
        : "") +
      "<dt>ATS status</dt><dd>Unknown (no Comeet data in this exercise)</dd></dl></div></div>"
    );
  }

  // ---------- Talent pool ----------
  function poolHtml() {
    const f = state.pf,
      confs = [
        ...new Set(pool.contacts.flatMap((c) => c.encounters.map((e) => e.conference_name))),
      ],
      doms = [
        ...new Set(pool.contacts.flatMap((c) => c.professional_domains.map((d) => d.domain))),
      ].sort();
    const rows = pool.contacts.filter((c) => {
      const e = c.encounters[c.encounters.length - 1];
      if (f.conference !== "all" && !c.encounters.some((x) => x.conference_name === f.conference))
        return false;
      if (f.domain !== "all" && !c.professional_domains.some((d) => d.domain === f.domain))
        return false;
      if (f.relevance !== "all" && e.relevance.level !== f.relevance) return false;
      return (
        !f.q ||
        (c.full_name + " " + titleOf(c) + " " + companyOf(c))
          .toLowerCase()
          .includes(f.q.toLowerCase())
      );
    });
    const opt = (v, l, cur) =>
      '<option value="' +
      esc(v) +
      '"' +
      (v === cur ? " selected" : "") +
      ">" +
      esc(l) +
      "</option>";
    const s = pool.summary,
      im = state.imported;
    const at = (x) => (x.source_file ? x.source_file + ", row " : "Row ") + x.row_number;
    const issues = pool.corrections
      .map(
        (x) =>
          at(x) + ": " + x.reason.replace("Missing", "missing") + ". Kept in the correction queue.",
      )
      .concat(
        pool.identityReview.map(
          (x) =>
            at(x) +
            " (" +
            (x.row.full_name || "unnamed") +
            "): " +
            x.reason.charAt(0).toLowerCase() +
            x.reason.slice(1) +
            ". Held for identity review.",
        ),
      );
    const n = (k, one, many) => k + " " + (k === 1 ? one : many);
    return (
      '<div class="pagehead"><h1>Talent pool</h1><p><b style="color:var(--ink)">' +
      pool.contacts.length +
      " people</b> from " +
      confs.length +
      " conferences, " +
      pool.contacts.filter((c) => c.profile).length +
      " with a LinkedIn profile attached" +
      (pool.contacts.some((c) => !c.profile)
        ? " and " + pool.contacts.filter((c) => !c.profile).length + " kept on badge details alone"
        : "") +
      ". Everyone stays: someone outside one conference's field can be exactly right for a later role.</p></div>" +
      '<div class="controls"><input type="search" id="pq" placeholder="Search the pool" value="' +
      esc(f.q) +
      '" aria-label="Search the pool">' +
      '<select id="p-conf" aria-label="Conference">' +
      opt("all", "All conferences", f.conference) +
      confs.map((c) => opt(c, c, f.conference)).join("") +
      "</select>" +
      '<select id="p-dom" aria-label="Professional domain">' +
      opt("all", "All professional domains", f.domain) +
      doms.map((d) => opt(d, d, f.domain)).join("") +
      "</select>" +
      '<select id="p-rel" aria-label="Relevance">' +
      opt("all", "Any relevance", f.relevance) +
      Object.keys(REL)
        .map((k) => opt(k, REL[k] + " for the conference", f.relevance))
        .join("") +
      "</select>" +
      '<span class="muted">' +
      rows.length +
      " of " +
      pool.contacts.length +
      "</span></div>" +
      '<div class="card tablewrap"><table class="pool"><thead><tr><th>Name</th><th>Role</th><th>Works in</th><th>Met at</th><th>Relevance to that conference</th><th>Enrichment</th></tr></thead><tbody>' +
      rows
        .map((c) => {
          const e = c.encounters[c.encounters.length - 1];
          return (
            "<tr><td><b>" +
            esc(c.full_name) +
            "</b></td><td>" +
            esc(titleOf(c)) +
            '<div class="muted small">' +
            esc(companyOf(c)) +
            "</div></td><td>" +
            esc(c.professional_domains.map((d) => d.domain).join(", ") || "Unknown") +
            "</td><td>" +
            esc(c.encounters.map((x) => x.conference_name).join("; ")) +
            '</td><td><span class="pill ' +
            e.relevance.level +
            '">' +
            REL[e.relevance.level] +
            '</span><div class="muted small">' +
            esc(e.relevance.reason) +
            "</div></td><td>" +
            esc(c.enrichment_status.replace(/_/g, " ")) +
            "</td></tr>"
          );
        })
        .join("") +
      "</tbody></table></div>" +
      '<div class="card pad importbox"><h3>Add a conference export</h3><p class="muted small">Same columns as conference_attendees.csv. Profiles are optional: people without one are kept and classified from their badge details. Try data/samples/new_conference_export.csv.</p>' +
      '<div class="import"><div><label for="f-att">Attendees CSV</label><input type="file" id="f-att" accept=".csv,text/csv"></div><div><label for="f-prof">LinkedIn profiles CSV (optional)</label><input type="file" id="f-prof" accept=".csv,text/csv"></div><div><button class="btn primary" id="do-import">Add to the pool</button> <button class="btn" id="undo-import">Reset to provided data</button></div></div>' +
      (im
        ? '<div class="notice"><b>Import finished.</b> ' +
          n(im.rows, "row", "rows") +
          " read: " +
          n(im.created, "new contact", "new contacts") +
          ", " +
          n(im.updated, "existing contact", "existing contacts") +
          " updated, " +
          n(im.encounters, "encounter", "encounters") +
          " added, " +
          n(im.held, "row", "rows") +
          " held for review.</div>"
        : "") +
      (issues.length
        ? '<div class="notice"><b>Rows that need a person to look at them</b><ul>' +
          issues.map((x) => "<li>" + esc(x) + "</li>").join("") +
          "</ul></div>"
        : "") +
      "</div>"
    );
  }

  // ---------- How it works ----------
  function howHtml() {
    const tx = D.taxonomy[state.jobId],
      G = { required: "Required skills", domains: "Key domains", nice_to_have: "Nice to have" },
      F = { title: "title", notes: "recruiter note", industry: "industry" };
    const chips = (terms, text) =>
      (terms || [])
        .map((t) => '<span class="chip">' + esc(t) + "</span>")
        .concat(
          Object.entries(text || {}).flatMap(([f, ws]) =>
            ws.map(
              (w) =>
                '<span class="chip" style="border-style:dashed">' +
                F[f] +
                " contains “" +
                esc(w) +
                "”</span>",
            ),
          ),
        )
        .join(" ") || '<span class="muted">none</span>';
    const rows = Object.keys(G)
      .map(
        (g) =>
          '<tr class="g"><td colspan="4">' +
          G[g] +
          "</td></tr>" +
          Object.entries(tx[g])
            .map(
              ([r, d]) =>
                "<tr><td><b>" +
                esc(r) +
                "</b></td><td>" +
                chips(d.full, d.text_full) +
                "</td><td>" +
                chips(d.partial, d.text_partial) +
                "</td><td>" +
                chips(d.exclude) +
                "</td></tr>",
            )
            .join(""),
      )
      .join("");
    const w = D.config.weights;
    return (
      '<div class="pagehead"><h1>How it works</h1><p>Four steps, one after the other. The same code runs here and on the command line.</p></div><div class="steps">' +
      [
        [
          "Capture",
          "Every attendee becomes a contact with a record of where we met. Importing a file twice creates no duplicates, and rows we cannot use wait in a correction queue.",
        ],
        [
          "Enrich and classify",
          "A LinkedIn profile is attached by URL when one exists. Title, skills and industry tell us what the person does, and we compare that with the conference's field. No profile? They are kept and classified from the badge.",
        ],
        [
          "Match to a role",
          "Each requirement is looked up in a term table. An equivalent term earns full credit, a related one half, a misleading one nothing. No evidence means a question to ask, never a rejection.",
        ],
        [
          "Find an introduction",
          "Connections are checked against the current employee list and graded by shared work history. They shape the next step and never change the score.",
        ],
      ]
        .map(
          (x, i) =>
            '<div><span class="n">' +
            (i + 1) +
            "</span><h3>" +
            x[0] +
            '</h3><p class="muted">' +
            x[1] +
            "</p></div>",
        )
        .join("") +
      "</div>" +
      '<div class="block"><h3>How the score is built</h3><p class="muted" style="max-width:76ch;margin-top:6px">Required skills ' +
      w.required +
      ", key domains " +
      w.domains +
      ", role family " +
      w.role_family +
      ", seniority " +
      w.seniority +
      ", nice to have " +
      w.nice_to_have +
      ". Inside each group every requirement weighs the same. These are starting values: six alternative weightings, from equal weights to 80% on required skills, keep at least 7 of the top 10 for every job, so the list follows the evidence more than the exact numbers. Try the sliders on the shortlist.</p></div>" +
      '<div class="block"><h3>Term table for ' +
      esc(result.job.title) +
      '</h3><p class="muted" style="max-width:76ch;margin:6px 0 14px">Job wording and profile wording differ. “Object Detection” is required for the ML role and appears in none of the 75 profiles; YOLO does. The table is plain configuration, a first version for the hiring manager to review.</p>' +
      '<div class="card tablewrap"><table class="terms"><thead><tr><th>Job requirement</th><th>Equivalent, full credit</th><th>Related, half credit</th><th>Misleading, no credit</th></tr></thead><tbody>' +
      rows +
      "</tbody></table></div></div>"
    );
  }

  // ---------- Wiring ----------
  function render(keepFocus) {
    const active = keepFocus && document.activeElement ? document.activeElement.id : null,
      pos = active && document.activeElement.selectionStart;
    document
      .querySelectorAll("nav.tabs button")
      .forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
    $("#job").value = state.jobId;
    $("#roles").innerHTML = jobs
      .map(
        (j) =>
          '<button class="rolebtn" data-job="' +
          esc(j.job_id) +
          '" aria-current="' +
          (j.job_id === state.jobId) +
          '"><b>' +
          esc(j.title) +
          "</b><span>" +
          esc(j.department) +
          '</span><i title="On the shortlist">' +
          counts[j.job_id] +
          "</i></button>",
      )
      .join("");
    $("#view").innerHTML =
      state.view === "matches" ? matchesHtml() : state.view === "pool" ? poolHtml() : howHtml();
    if (state.view === "matches") $("#conn").value = state.conn;
    if (active && $("#" + active)) {
      const el = $("#" + active);
      el.focus();
      if (pos != null && el.setSelectionRange)
        try {
          el.setSelectionRange(pos, pos);
        } catch (e) {}
    }
  }
  function csvNow() {
    return T.exportMatches(result.shortlist, result.job);
  }
  function readFile(input) {
    return new Promise((res) => {
      const f = input.files && input.files[0];
      if (!f) return res(null);
      const r = new FileReader();
      r.onload = () => res({ text: String(r.result), name: f.name });
      r.onerror = () => res(null);
      r.readAsText(f);
    });
  }

  document.addEventListener("click", async (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.view) {
      state.view = t.dataset.view;
      render();
      window.scrollTo(0, 0);
    } else if (t.dataset.job) {
      state.jobId = t.dataset.job;
      state.selected = null;
      state.csv = "";
      state.view = "matches";
      try {
        location.hash = t.dataset.job;
      } catch (e) {}
      compute();
      render();
    } else if (t.classList.contains("row")) {
      state.selected = t.dataset.id;
      render();
      if (window.matchMedia("(max-width:1120px)").matches)
        document.querySelector(".detail").scrollIntoView({ behavior: "smooth" });
    } else if (t.id === "reset") {
      state.weights = Object.assign({}, D.config.weights);
      compute();
      render();
    } else if (t.id === "export") {
      const csv = csvNow();
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = result.job.job_id + "_shortlist.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {}
      state.csv = csv;
      render();
      toast(
        "CSV prepared: " +
          result.shortlist.length +
          " rows. If no download started, copy it from the box below.",
      );
    } else if (t.id === "copy") {
      const csv = csvNow();
      state.csv = csv;
      render();
      try {
        await navigator.clipboard.writeText(csv);
        toast("Shortlist CSV copied to the clipboard.");
      } catch (e) {
        toast("Copy was blocked by the browser. Select the text in the box instead.");
      }
    } else if (t.id === "do-import") {
      const att = await readFile($("#f-att")),
        prof = await readFile($("#f-prof"));
      if (!att) return toast("Choose an attendees CSV first.");
      const rows = T.parseCsv(att.text),
        need = ["full_name", "conference_name"];
      rows.forEach((r, i) => {
        r._row_number = i + 2;
        r._source_file = att.name;
      });
      if (!rows.length || need.some((k) => !(k in rows[0])))
        return toast(
          "That file does not look like an attendee export: it needs full_name and conference_name columns.",
        );
      const before = pool.summary,
        beforeCount = pool.contacts.length;
      state.attendees = state.attendees.concat(rows);
      if (prof) state.profiles = state.profiles.concat(T.parseCsv(prof.text));
      compute();
      const s = pool.summary;
      state.imported = {
        rows: rows.length,
        created: pool.contacts.length - beforeCount,
        updated: s.updated - before.updated,
        encounters: s.encounters_added - before.encounters_added,
        held: s.corrections + s.identity_review - before.corrections - before.identity_review,
      };
      render();
      toast("Import finished.");
    } else if (t.id === "undo-import") {
      state.attendees = T.parseCsv(D.attendees);
      state.profiles = T.parseCsv(D.profiles);
      state.imported = null;
      compute();
      render();
    }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "q") {
      state.search = t.value;
      render(true);
    } else if (t.dataset.w) {
      state.weights[t.dataset.w] = Number(t.value);
      compute();
      render(true);
    } else if (t.id === "pq") {
      state.pf.q = t.value;
      render(true);
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "job") {
      state.jobId = t.value;
      state.selected = null;
      state.csv = "";
      try {
        location.hash = t.value;
      } catch (e) {}
      compute();
      render();
    } else if (t.id === "conn") {
      state.conn = t.value;
      render();
    } else if (t.id === "p-conf") {
      state.pf.conference = t.value;
      render();
    } else if (t.id === "p-dom") {
      state.pf.domain = t.value;
      render();
    } else if (t.id === "p-rel") {
      state.pf.relevance = t.value;
      render();
    }
  });
  function fromHash() {
    const h = (location.hash || "").replace("#", "");
    if (jobs.some((j) => j.job_id === h) && h !== state.jobId) {
      state.jobId = h;
      state.selected = null;
      compute();
      render();
    }
  }
  window.addEventListener("hashchange", fromHash);

  $("#job").innerHTML = jobs
    .map(
      (j) =>
        '<option value="' + esc(j.job_id) + '">' + esc(j.job_id + " · " + j.title) + "</option>",
    )
    .join("");
  const h = (location.hash || "").replace("#", "");
  if (jobs.some((j) => j.job_id === h)) state.jobId = h;
  compute();
  render();
})();
</script>
</body>
</html>
